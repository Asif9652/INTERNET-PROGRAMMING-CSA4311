
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Code Inspection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f2f5f9;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        .result {
            background: #e5f6e9;
            padding: 15px;
            margin-top: 15px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>HTML Code Inspection</h2>

    <h1>Welcome</h1>
    <p>This is a paragraph.</p>

    <img
        src="https://placehold.co/300x150?text=Sample+Image"
        alt="Sample image"
        width="300"
        height="150"
    >

    <div class="result">
        <h3>Code Analysis</h3>
        <p>Heading: Properly closed</p>
        <p>Paragraph: Properly closed</p>
        <p>Image: Includes alternative text</p>
        <p>Status: Corrected HTML structure</p>
    </div>
</div>
</body>
</html>
