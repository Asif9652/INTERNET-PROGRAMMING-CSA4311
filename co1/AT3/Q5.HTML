
<!DOCTYPE html>
<html>
<head>
    <title>HTTP Communication</title>
</head>
<body>
    <h2>Web Communication</h2>
    <p>HTTP enables communication between
       a web browser and a web server.</p>

    <button onclick="getData()">Send HTTP Request</button>

    <p id="result"></p>

    <script>
        async function getData() {
            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/todos/1"
                );

                const data = await response.json();

                document.getElementById("result").textContent =
                    "HTTP Status: " + response.status +
                    " | Data: " + data.title;
            } catch (error) {
                document.getElementById("result").textContent =
                    "Request failed.";
            }
        }
    </script>
</body>
</html>
