
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #555;
            text-align: center;
        }

        h2 {
            color: #5145cd;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            margin: 8px;
            border: none;
            border-radius: 6px;
            background: #5145cd;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #372da8;
        }

        video, canvas {
            width: 90%;
            max-width: 320px;
            margin-top: 15px;
            border-radius: 10px;
            border: 2px solid #5145cd;
        }

        #result {
            color: #222;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Registration</h2>

    <input type="text" id="name" placeholder="Enter Student Name">
    <input type="text" id="roll" placeholder="Enter Roll Number">
    <input type="text" id="dept" placeholder="Enter Department">

    <br>
    <br>
    <button onclick="window.prompt('Enter your name')">
        Enter Name
    </button>

    <br><br>

    <button onclick="window.prompt('Enter your roll number')">
        Enter Roll Number
    </button>

    <br><br>

    <button onclick="window.confirm('Are you sure you want to submit?')">
        Submit Details
    </button>
    <button type="button" onclick="openCamera()">
        Open Camera
    </button>

    <br>

    <video id="camera" autoplay playsinline></video>

    <br>

    <button type="button" onclick="capturePhoto()">
        Capture Photo
    </button>

    <h3>Captured Photo</h3>

    <canvas id="canvas" hidden></canvas>
    <img id="photo" alt="Captured student photo"
         style="display:none; width:90%; max-width:320px;
         border-radius:10px; border:2px solid #5145cd;">

    <br>

    <button type="button" onclick="showDetails()">
        Submit Details
    </button>

    <p id="result"></p>
</div>

<script>
    let stream;

    async function openCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: true
            });

            document.getElementById("camera").srcObject = stream;
        } catch (error) {
            alert("Please allow camera access!");
        }
    }

    function capturePhoto() {
        const video = document.getElementById("camera");
        const canvas = document.getElementById("canvas");
        const photo = document.getElementById("photo");

        if (!stream || video.videoWidth === 0) {
            alert("Please open the camera first!");
            return;
        }

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        canvas.getContext("2d").drawImage(
            video, 0, 0, canvas.width, canvas.height
        );

        photo.src = canvas.toDataURL("image/png");
        photo.style.display = "inline-block";

        alert("Photo captured successfully!");
    }

    function showDetails() {
        const name = document.getElementById("name").value.trim();
        const roll = document.getElementById("roll").value.trim();
        const dept = document.getElementById("dept").value.trim();

        if (!name || !roll || !dept) {
            alert("Please fill in all student details!");
            return;
        }

        document.getElementById("result").innerHTML = "";

        const result = document.getElementById("result");

        [ "Name: " + name, "Roll Number: " + roll,
          "Department: " + dept ].forEach(function(text) {
            const p = document.createElement("p");
            p.textContent = text;
            result.appendChild(p);
        });

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
    }
</script>

</body>
</html>
