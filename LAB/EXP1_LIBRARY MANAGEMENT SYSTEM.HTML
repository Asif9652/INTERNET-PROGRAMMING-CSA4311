<!DOCTYPE html>
<html>
<head>
<title>Library Management System</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0}
header{background:#2c3e50;color:white;padding:20px;text-align:center}
nav button{padding:10px;margin:5px;background:#3498db;color:white;border:0}
.container{background:white;margin:30px auto;padding:20px;max-width:800px}
input,select{padding:10px;margin:8px;width:90%}
button{padding:10px;background:#3498db;color:white;border:0}
.book{background:#eee;padding:15px;margin:10px}
</style>
</head>

<body>

<header>
<h1>📚 Library Management System</h1>
<button onclick="home()">Home</button>
<button onclick="books()">Books</button>
<button onclick="login()">Login</button>
<button onclick="admin()">Admin</button>
</header>

<div class="container" id="content">
<h2>Welcome to College Library</h2>
<p>Search, borrow and manage library books easily.</p>
</div>

<script>

function home(){
document.getElementById("content").innerHTML=
"<h2>Library Home</h2><p>Welcome Students and Librarians!</p>";
}

function books(){
document.getElementById("content").innerHTML=`
<h2>Search Books</h2>
<input id="search" placeholder="Search Book">
<div class="book"><h3>Java Programming</h3>
<p>Author: Herbert Schildt</p>
<p>Status: Available</p>
<button onclick="borrow()">Borrow</button></div>
<div class="book"><h3>Database Management</h3>
<p>Author: Silberschatz</p>
<p>Status: Available</p>
<button onclick="borrow()">Borrow</button></div>`;
}

function borrow(){
alert("Book Issued Successfully!");
}

function login(){
document.getElementById("content").innerHTML=`
<h2>User Login</h2>
<input placeholder="Email">
<input type="password" placeholder="Password">
<button onclick="alert('Login Successful')">Login</button>`;
}

function admin(){
document.getElementById("content").innerHTML=`
<h2>Librarian Admin</h2>
<input placeholder="Book Name">
<input placeholder="Author">
<input placeholder="Year">
<button onclick="alert('Book Added')">Add Book</button>
<h3>Manage Books</h3>
<button onclick="alert('Book Updated')">Update Book</button>
<button onclick="alert('Book Deleted')">Delete Book</button>
<h3>Issue / Return</h3>
<button onclick="alert('Book Issued')">Issue Book</button>
<button onclick="alert('Book Returned')">Return Book</button>
<h3>Fine</h3>
<input placeholder="Fine Amount">
<button onclick="alert('Fine Added')">Make Fine</button>`;
}

</script>

</body>
